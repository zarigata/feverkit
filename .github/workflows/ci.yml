name: FeverKit CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Validate manifest and templates
        run: python3 tools/feverkit.py validate
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Compile CLI
        run: python3 -m py_compile tools/feverkit.py
