name: Bug report
description: Report a reproducible FeverKit CLI or template issue
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps (remove secrets)
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python version and operating system
